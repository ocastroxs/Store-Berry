<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store Berry - Finalize a sua compra</title>
    <link rel="stylesheet" href="/CSS/carrinho.css" />
    <link rel="shortcut icon" href="/Images/Icon.svg" type="image/x-icon" />
  </head>

  <body>
    <div class="banner" id="banner">
      <header>
        <div class="space-icon">
          <img src="/Images/Icon.svg" alt="Icon" />
        </div>

        <nav>
          <div class="one-nav">
            <a href="/">Home</a>
          </div>
          <div class="one-nav">
            <a href="/cardapio">Cardápio</a>
          </div>
          <div class="one-nav" style="margin-left: 1vw">
            <a href="/sobre">Sobre Nós</a>
          </div>
        </nav>

        <div class="space-others">
          <div class="other">
            <a href="/carrinho" class="active">Carrinho</a>
          </div>
          <div class="other-destaque">
            <a href="/conta/entrar" id="btnLoginHeader">Login</a>
          </div>
        </div>
      </header>
    </div>

    <div class="padding">
      <div class="info-carrinho">
        <div class="title-carrinho">
          <img src="/Images/Carrinho.svg" alt="Ícone de Carrinho" />
          <h3>Seu Carrinho</h3>
        </div>
        <div class="quantidade-carrinho">
          <p id="quantidade-itens">0 itens no carrinho</p>
        </div>
      </div>

      <div class="cont">
        <div class="all-produtos" id="lista-produtos"></div>

        <div class="resumo-produtos">
          <div class="title-resumo">
            <h3>Resumo do Pedido</h3>
          </div>

          <div class="precos-resumo">
            <div class="subtotal-resumo">
              <p>Subtotal:</p>
              <p id="subtotal">R$ 0,00</p>
            </div>

            <div class="entrega-resumo">
              <p>Entrega:</p>
              <p id="entrega">Grátis</p>
            </div>

            <div class="linha-resumo"></div>

            <div class="total-resumo">
              <p>Total:</p>
              <p id="total">R$ 0,00</p>
            </div>
          </div>

          <div class="buttons-resumo">
            <div class="finalizar-resumo">
              <button id="btn-finalizar">Finalizar Pedido →</button>
            </div>

            <div class="continuar-resumo">
              <a href="/cardapio"><button id="btn-continuar">Continuar Comprando</button></a>
            </div>
          </div>

          <div class="desconto-resumo">
            <p>🍓 Entrega grátis para compras acima de <br />R$5,00</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal de Pagamento PIX -->
    <div id="modalPix" class="modal-pix">
      <div class="modal-content-pix">
        <button class="close-modal" id="closeModal">&times;</button>

        <div class="pix-container">
          <h2>Pague com PIX</h2>
          <p class="pix-subtitle">Escaneie o código abaixo para pagar</p>

          <div class="qrcode-wrapper">
            <img id="qrcode" src="" alt="QR Code PIX" width="280" height="280" />
          </div>

          <div class="pix-info">
            <p class="pix-label">Chave PIX:</p>
            <p class="pix-key" id="pixKey">11994705544</p>
            <button class="btn-copy" id="btnCopyPix">Copiar Chave</button>
          </div>

          <div class="pix-total">
            <p>Valor a Pagar:</p>
            <p class="pix-value" id="pixValue">R$ 0,00</p>
          </div>

          <button class="btn-pix-confirm" id="btnConfirmPix">Já Paguei</button>
        </div>
      </div>
    </div>

    <script src="/JS/carrinho.js"></script>
    <script src="/JS/auth-check.js"></script>
  </body>
</html>
